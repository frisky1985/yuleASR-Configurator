name: Build Desktop App

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish artifacts to GitHub release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (for embedding in desktop)
        run: cd apps/yuleasr-web && npx vite build --base ./

      - name: Build desktop app for macOS (universal)
        run: |
          cd apps/yuleasr-desktop
          cp -r ../yuleasr-web/dist .
          npx electron-builder --mac --universal --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: List release artifacts
        run: ls -la apps/yuleasr-desktop/release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuleasr-desktop-mac
          path: |
            apps/yuleasr-desktop/release/yuleASR\ Configurator-*.dmg
            apps/yuleasr-desktop/release/yuleASR\ Configurator-*.zip
            apps/yuleasr-desktop/release/latest-mac.yml
          retention-days: 90

      - name: Upload to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/yuleasr-desktop/release/yuleASR Configurator-*.dmg
            apps/yuleasr-desktop/release/yuleASR Configurator-*.zip
            apps/yuleasr-desktop/release/latest-mac.yml
          generate_release_notes: false
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (for embedding in desktop)
        run: cd apps/yuleasr-web && npx vite build --base ./

      - name: Build desktop app for Linux
        run: |
          cd apps/yuleasr-desktop
          cp -r ../yuleasr-web/dist .
          npx electron-builder --linux --publish never

      - name: List release artifacts
        run: ls -la apps/yuleasr-desktop/release/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuleasr-desktop-linux
          path: |
            apps/yuleasr-desktop/release/yuleASR\ Configurator-*.AppImage
            apps/yuleasr-desktop/release/yuleASR\ Configurator-*.deb
            apps/yuleasr-desktop/release/latest-linux.yml
          retention-days: 90

      - name: Upload to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/yuleasr-desktop/release/yuleASR Configurator-*.AppImage
            apps/yuleasr-desktop/release/yuleASR Configurator-*.deb
            apps/yuleasr-desktop/release/latest-linux.yml
          generate_release_notes: false
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    name: Build Windows (NSIS + zip)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (for embedding in desktop)
        run: cd apps/yuleasr-web; npx vite build --base ./
        shell: bash

      - name: Build desktop app for Windows (portable zip + NSIS)
        run: |
          cd apps/yuleasr-desktop
          cp -r ../yuleasr-web/dist .
          npx electron-builder --win --publish never
        shell: bash

      - name: List release artifacts
        run: dir apps\yuleasr-desktop\release\

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuleasr-desktop-win
          path: |
            apps/yuleasr-desktop/release/*.exe
            apps/yuleasr-desktop/release/*.zip
            apps/yuleasr-desktop/release/latest.yml
          retention-days: 90

      - name: Upload to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/yuleasr-desktop/release/*.exe
            apps/yuleasr-desktop/release/*.zip
            apps/yuleasr-desktop/release/latest.yml
          generate_release_notes: false
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Signing job — only runs on tag pushes with certs available
  sign-mac:
    name: Sign macOS Build (notarized)
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-mac
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: yuleasr-desktop-mac
          path: release

      - name: Codesign & Notarize
        run: |
          # Codesigning is handled by electron-builder at build time when
          # CSC_LINK / CSC_KEY_PASSWORD are provided. This job exists to
          # document the notarization step and can be extended with:
          #   xcrun notarytool submit ...
          echo "Codesigning handled at build time via CSC_LINK / CSC_KEY_PASSWORD"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
