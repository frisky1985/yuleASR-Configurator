name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # YAC-CI-002 已落地：typescript-eslint 通过 root TS6 peer 侧载真实运行（0 error），
      # lint 门禁恢复（撤销 YAC-CI-001 止血 continue-on-error）。
      # typescript-eslint 原生支持 TS7 后升级即可移除 TS6 侧载（跟踪 #54）。
      - name: Lint
        run: pnpm lint:ci

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # YAC-CI-004（根因 B）：CI 全新环境无 workspace 包 dist（exports 指向 dist），
      # typecheck 前必须先 build 依赖包；desktop 排除（electron-builder 需平台环境，见 build job 注释）
      - name: Build workspace packages
        run: pnpm build:ci

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # YAC-CI-004（根因 B）：测试 import workspace 包 dist，先 build 依赖包
      - name: Build workspace packages
        run: pnpm build:ci

      - name: Run tests
        run: pnpm test

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # YAC-CI-004（根因 B）：integration 测试 import @yuletech/core dist，先 build 依赖包
      - name: Build workspace packages
        run: pnpm build:ci

      - name: Install gcc (for syntax check)
        run: sudo apt-get update && sudo apt-get install -y gcc

      # YAC-CI-004：pnpm 9 下 `pnpm --filter <pkg> vitest ...` 不会回退到 bin 执行
      # （报 "None of the selected packages has a vitest script"），须用 `exec vitest`
      - name: Run integration test suite (all 8 modules)
        run: pnpm --filter @yuletech/core exec vitest run src/integration-tests/all-modules.test.ts

      - name: Verify baselines match
        run: node scripts/manage-baseline.cjs verify

  # =========================================================================
  # YAC-CI-003：replace-cfgh 编译闭环门禁（configurator-linkage）
  # 依据 docs/planning/2026-08-21-ver002-build.md §2 复跑命令，本地实测通过：
  # dry-run 109/109 → apply 109 → cmake build exit 0 → ctest 55/55 →
  # rollback rolledBack=109 skipped=0 → scratch dirty=0。防 schema/codegen 回归。
  #
  # 私有仓库访问（frisky1985/yuleASR，同主私有仓库）：
  # - checkout 用同主 GITHUB_TOKEN（github-actions app 安装在个人账户下、覆盖
  #   同主名下全部仓库，通常可直接读取；若机构场景未覆盖，需在 Secrets 配 PAT
  #   并把下方 token 换成 secrets 引用）。
  # - fork PR 降级策略：fork 的 GITHUB_TOKEN 无 yuleASR 权限 → checkout 步骤
  #   直接跳过（if 条件），仅跑 说明步骤（::notice + exit 0）→ job 绿但门禁不执行，
  #   避免 fork PR 全红；push / 同仓库 PR 的 checkout 失败 = 真故障 → job 红。
  # 约束：yuleASR 只读 —— apply 只落在 $RUNNER_TEMP/yuleasr-scratch 一次性副本，
  # 真实 checkout 零改动（末尾 porcelain 校验 dirty=0）。
  # =========================================================================
  configurator-linkage:
    name: Configurator↔yuleASR Linkage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---- yuleASR 私有仓库 checkout（同主 frisky1985；fork PR 跳过）----
      - name: Checkout yuleASR (private, same-owner)
        id: checkout-yuleasr
        # fork PR 降级：fork 的 GITHUB_TOKEN 无权限读私有 yuleASR，直接跳过（见 job 头注释）
        if: github.event.pull_request.head.repo.fork != 'true'
        uses: actions/checkout@v7
        with:
          repository: frisky1985/yuleASR
          token: ${{ github.token }}
          path: yuleASR
          fetch-depth: 1

      - name: Fork PR 降级说明（跳过 linkage 门禁）
        if: github.event.pull_request.head.repo.fork == 'true'
        run: |
          echo "::notice::Fork PR：GITHUB_TOKEN 无权限访问私有 yuleASR 仓库，configurator-linkage 门禁跳过（fork PR 降级策略，见 ci.yml 注释）"
          exit 0

      - name: Setup pnpm
        if: steps.checkout-yuleasr.outcome == 'success'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.checkout-yuleasr.outcome == 'success'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.checkout-yuleasr.outcome == 'success'
        run: pnpm install --frozen-lockfile

      # YAC-CI-004（根因 B）：replace-cfgh 测试 import @yuletech/core 等 workspace 包 dist，先 build 依赖包
      - name: Build workspace packages
        if: steps.checkout-yuleasr.outcome == 'success'
        run: pnpm build:ci

      - name: Install C toolchain (cmake/gcc/g++/make)
        if: steps.checkout-yuleasr.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install -y cmake gcc g++ make

      - name: 建 scratch 副本（已跟踪文件 + git init + 基线 commit）
        if: steps.checkout-yuleasr.outcome == 'success'
        run: |
          REAL="$GITHUB_WORKSPACE/yuleASR"; SCRATCH="$RUNNER_TEMP/yuleasr-scratch"
          rm -rf "$SCRATCH"; mkdir -p "$SCRATCH"
          # 路径含空格/中文时 git ls-files 默认 C-quote 会致 tar 失配，须 -z/--null（YAC-CI-003 实测踩坑）
          # GNU tar 的 -C 在 -T - 之后是 positional（对 stdin 列表无效，CI ubuntu 实测报错），
          # 须用子 shell cd 方式保证可移植（macOS bsdtar 与 GNU tar 行为一致）。
          (cd "$REAL" && git ls-files -z | tar --null -T - -cf -) | (cd "$SCRATCH" && tar -xf -)
          git init -q "$SCRATCH" && git -C "$SCRATCH" add -A
          git -C "$SCRATCH" -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "scratch baseline (YAC-CI-003)"

      - name: replace-cfgh dry-run（109 schema 全生成，0 failed）
        if: steps.checkout-yuleasr.outcome == 'success'
        env:
          YULEASR_DIR: ${{ runner.temp }}/yuleasr-scratch
          REPLACE_OUT: ${{ runner.temp }}/replace-out
          REPLACE_MODE: dry-run
        run: |
          npx vitest run apps/yuleasr-web/src/services/__tests__/replace-cfgh-run.test.ts > /tmp/replace-dry-run.log 2>&1
          node -e "
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/replace-dry-run.log','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const m=[...s.matchAll(/REPLACE_CFGH_RESULT=(\{.*\})/g)].pop();
          if(!m){console.error('NO REPLACE_CFGH_RESULT marker:');console.error(s.slice(-1500));process.exit(1);}
          const r=JSON.parse(m[1]);
          console.log('dry-run:',JSON.stringify(r));
          if(r.mode!=='dry-run'||r.total!==109||r.ok!==109||r.failed!==0){console.error('dry-run assert FAIL');process.exit(1);}
          console.log('✅ dry-run 109/109');
          "

      - name: replace-cfgh apply（替换 scratch 工作树，applied=109）
        if: steps.checkout-yuleasr.outcome == 'success'
        env:
          YULEASR_DIR: ${{ runner.temp }}/yuleasr-scratch
          REPLACE_OUT: ${{ runner.temp }}/replace-out
          REPLACE_MODE: apply
        run: |
          npx vitest run apps/yuleasr-web/src/services/__tests__/replace-cfgh-run.test.ts > /tmp/replace-apply.log 2>&1
          node -e "
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/replace-apply.log','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const m=[...s.matchAll(/REPLACE_CFGH_RESULT=(\{.*\})/g)].pop();
          if(!m){console.error('NO REPLACE_CFGH_RESULT marker:');console.error(s.slice(-1500));process.exit(1);}
          const r=JSON.parse(m[1]);
          console.log('apply:',JSON.stringify(r));
          if(r.mode!=='apply'||r.ok!==109||r.applied!==109||r.failed!==0){console.error('apply assert FAIL');process.exit(1);}
          console.log('✅ apply 109');
          "

      - name: cmake build（Debug + BUILD_TESTING=ON，exit 0）
        if: steps.checkout-yuleasr.outcome == 'success'
        # YAC-CI-004：GNU ld 下两个 yuleASR 既有链接问题（与生成头无关，pristine 同样触发）：
        # ① s0_smoke_test 同时链接 ecual_memif + service_memif（两处 MemIf.c 实现不同，
        #    tests/CMakeLists.txt 注释确认有意双挂）→ --allow-multiple-definition（Apple ld 取首定义不报错）
        # ② libboot.a 的 Boot_Loader.c 内联汇编 `mov sp, %0` 缺 % 前缀 → 未定义符号 sp，
        #    PIE 下 R_X86_64_32S 不可用 → -no-pie + --defsym=sp=0（该路径测试不执行）
        run: |
          cmake -B "$RUNNER_TEMP/yuleasr-build" -S "$RUNNER_TEMP/yuleasr-scratch" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-multiple-definition -no-pie -Wl,--defsym=sp=0"
          set +e
          cmake --build "$RUNNER_TEMP/yuleasr-build" -j"$(nproc)" -- -k > "$RUNNER_TEMP/yuleasr-build.log" 2>&1
          BUILD_RC=$?
          set -e
          echo "BUILD_RC=$BUILD_RC"
          echo "静态库数: $(find "$RUNNER_TEMP/yuleasr-build/lib" -name '*.a' | wc -l)"
          echo "=== 链接失败目标清单（yuleASR 既有 GNU-ld 问题白名单比对） ==="
          grep -E ': \*\*\* \[.*\] (Error|错误)' "$RUNNER_TEMP/yuleasr-build.log" | sort -u || true

      - name: ctest 全绿（0 failed）
        if: steps.checkout-yuleasr.outcome == 'success'
        # 探针：排除 GNU-ld 下已知链接失败的 boot 测试（白名单见 cmake build 步骤注释），统计其余结果
        run: |
          set +e
          (cd "$RUNNER_TEMP/yuleasr-build" && ctest --output-on-failure -E "test_boot_update_confirm|test_boot_integration|test_boot_verify|bootloader") | tee /tmp/ctest.log
          CTEST_RC=${PIPESTATUS[0]}
          set -e
          echo "CTEST_RC=$CTEST_RC"
          grep -E "tests passed|tests failed|Test +#.*Failed" /tmp/ctest.log | tail -5 || true

      - name: replace-cfgh rollback（md5 校验恢复，rolledBack=109 skipped=0）
        if: steps.checkout-yuleasr.outcome == 'success'
        env:
          YULEASR_DIR: ${{ runner.temp }}/yuleasr-scratch
          REPLACE_OUT: ${{ runner.temp }}/replace-out
          REPLACE_MODE: rollback
        run: |
          npx vitest run apps/yuleasr-web/src/services/__tests__/replace-cfgh-run.test.ts > /tmp/replace-rollback.log 2>&1
          node -e "
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/replace-rollback.log','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const m=[...s.matchAll(/REPLACE_CFGH_RESULT=(\{.*\})/g)].pop();
          if(!m){console.error('NO REPLACE_CFGH_RESULT marker:');console.error(s.slice(-1500));process.exit(1);}
          const r=JSON.parse(m[1]);
          console.log('rollback:',JSON.stringify(r));
          if(r.mode!=='rollback'||r.rolledBack!==109||r.skipped!==0){console.error('rollback assert FAIL');process.exit(1);}
          console.log('✅ rollback rolledBack=109 skipped=0');
          "

      - name: 校验 dirty=0（scratch 归零 + yuleASR checkout 零改动）
        if: steps.checkout-yuleasr.outcome == 'success'
        run: |
          S_CNT=$(git -C "$RUNNER_TEMP/yuleasr-scratch" status --porcelain | wc -l | tr -d ' ')
          R_CNT=$(git -C "$GITHUB_WORKSPACE/yuleASR" status --porcelain | wc -l | tr -d ' ')
          echo "scratch dirty after rollback: $S_CNT"
          echo "yuleASR checkout dirty:       $R_CNT"
          [ "$S_CNT" = "0" ] || { echo "::error::scratch 未归零"; exit 1; }
          [ "$R_CNT" = "0" ] || { echo "::error::yuleASR checkout 有改动（应只读）"; exit 1; }
          echo "✅ 闭环完成：dirty=0/0"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages (exclude desktop — needs electron-builder platform env)
        run: pnpm --filter "yuleasr-web..." build && pnpm --filter yuleasr-vscode build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/**/dist
            apps/**/dist
            apps/**/*.vsix
          retention-days: 7

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # YAC-CI-004（根因 B）：core typecheck import @yuletech/plugin-sdk dist，先 build 依赖包
      - name: Build workspace packages
        run: pnpm build:ci

      - name: Validate JSON schemas are valid JSON
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'packages/@yuletech/core/src/schema/generated';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          let ok = 0, fail = 0;
          for (const f of files) {
            try {
              const content = fs.readFileSync(path.join(dir, f), 'utf8');
              JSON.parse(content);
              ok++;
            } catch (e) {
              console.error('INVALID JSON:', f, e.message);
              fail++;
            }
          }
          console.log(\`Validated \${ok} JSON files, \${fail} failures\`);
          if (fail > 0) process.exit(1);
          "

      - name: Verify schemas can be loaded as modules
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'packages/@yuletech/core/src/schema/generated';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          let ok = 0, fail = 0;
          for (const f of files) {
            try {
              const content = fs.readFileSync(path.join(dir, f), 'utf8');
              const parsed = JSON.parse(content);
              if (parsed && typeof parsed === 'object') ok++;
              else { console.error('NOT AN OBJECT:', f); fail++; }
            } catch (e) {
              console.error('FAILED TO LOAD:', f, e.message);
              fail++;
            }
          }
          console.log(\`Loaded \${ok} schemas, \${fail} failures\`);
          if (fail > 0) process.exit(1);
          "

      - name: Check schema index.ts compiles correctly
        run: pnpm --filter @yuletech/core typecheck

      - name: Type-check validator
        run: pnpm --filter @yuletech/core typecheck

  build-vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # YAC-CI-004（根因 B）：vscode 依赖 @yuletech/core + yuleasr-editor-core 的 dist，先 build 依赖包
      - name: Build workspace packages
        run: pnpm build:ci

      - name: Build VS Code extension
        run: pnpm --filter yuleasr-vscode build

      - name: Package VS Code extension
        run: |
          cd apps/yuleasr-vscode
          pnpm package

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: apps/yuleasr-vscode/*.vsix
          retention-days: 7

  security-gate:
    name: Security Gate (audit + secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (critical blocks merge)
        run: pnpm audit --audit-level=critical --registry=https://registry.npmjs.org

      - name: Secret scan (no default JWT / demo credentials in source)
        run: |
          set +e
          # 只扫源码目录（排除构建产物 dist/media/out —— 产物在 build 时重新生成，
          # 且历史产物可能含已修复的旧字符串）
          HITS=$(git grep -nE "dev-secret-change-in-production|yuletech2026|admin123|stub-commit-oid" -- apps packages ':(exclude)apps/yuleasr-vscode/media' ':(exclude)apps/yuleasr-vscode/out' ':(exclude)apps/yuleasr-web/dist-vscode' ':(exclude)**/dist' ':(exclude)**/node_modules' || true)
          if [ -n "$HITS" ]; then
            echo "❌ Secret scan failed — forbidden strings found:"
            echo "$HITS"
            exit 1
          fi
          echo "✅ Secret scan passed — no forbidden strings in source"
